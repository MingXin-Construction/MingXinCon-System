window.addEventListener('beforeprint', function(){ window.__origTitle = document.title; document.title = ' '; });
window.addEventListener('afterprint', function(){ if (window.__origTitle) document.title = window.__origTitle; });

<style>
  :root{
    --navy:#1F3A5F;
    --navy-dk:#152943;
    --red:#C0392B;
    --labelred:#EA1C1C;
    --amber:#F2A93B;
    --amber-dk:#B9791C;
    --green:#2E7D46;
    --lightblue:#DCE6F1;
    --grey:#F5F5F5;
    --border:#D9D9D9;
    --bg:#F7F8FA;
    --text:#1A1A1A;
    --muted:#777;
    --accent:#2563EB;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI', Arial, sans-serif; font-size:14px; color:var(--text); background:var(--bg); }

  header.site-header{
    background:#ffffff; border-bottom:3px solid var(--navy); padding:12px 28px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.10);
    min-height:76px; gap:16px; flex-wrap:wrap;
  }
  header.site-header .brand{ display:flex; align-items:center; gap:14px; }
  header.site-header .brand a{ display:flex; }
  header.site-header img.logo{ height:38px; width:auto; }
  header.site-header .brand-text .title{ font-weight:700; font-size:16px; color:var(--navy); letter-spacing:0.02em; }
  header.site-header .brand-text .sub{ font-size:11px; color:#888; margin-top:1px; }

  .app-nav{
    background:var(--navy); display:flex; gap:4px; padding:0 24px; position:sticky; top:0; z-index:99; overflow-x:auto;
  }
  .app-nav-link{
    color:#B9C6D9; text-decoration:none; font-size:12.5px; font-weight:600; padding:10px 16px;
    border-bottom:3px solid transparent; white-space:nowrap; transition:all 0.15s;
  }
  .app-nav-link:hover{ color:#fff; background:rgba(255,255,255,0.06); }
  .app-nav-link.active{ color:#fff; border-bottom-color:var(--amber); }

  .container{ max-width:1100px; margin:0 auto; padding:22px 24px 60px; }

  .card{ background:#fff; border-radius:10px; border:1px solid var(--border); margin-bottom:20px; overflow:hidden; }
  .card-header{ background:var(--navy); color:#fff; padding:11px 18px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .card-body{ padding:18px; }
  .step-badge{ background:rgba(255,255,255,0.2); width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; }

  .field-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  .field-grid.two{ grid-template-columns:repeat(2, 1fr); }
  .field label{ display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px; }
  .field input, .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:13px; color:var(--text); background:#fff; font-family:inherit; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(37,99,235,0.12); }
  .field textarea{ resize:vertical; min-height:64px; }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  .checkbox-row input{ width:auto; }
  .checkbox-row label{ margin:0; text-transform:none; font-size:12.5px; font-weight:500; color:var(--text); }

  .quick-add-title{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin:4px 0 8px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip{
    background:var(--lightblue); color:var(--navy); border:1px solid #C3D5E8; border-radius:20px;
    padding:6px 14px; font-size:12px; cursor:pointer; transition:all 0.15s; font-weight:600;
  }
  .chip:hover{ background:#c9dcf0; }

  table.item-table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead tr{ background:var(--navy); color:#fff; }
  th{ text-align:left; padding:9px 10px; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
  td{ padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  td input, td textarea{ width:100%; border:1px solid var(--border); border-radius:5px; padding:6px 8px; font-size:13px; font-family:inherit; }
  td textarea{ resize:vertical; min-height:34px; }
  .qty-col{ width:110px !important; }
  .remark-col{ width:150px !important; }
  .del-btn{ background:none; border:none; color:var(--red); cursor:pointer; font-size:16px; padding:2px 6px; }
  .del-btn:hover{ background:#FBEAEA; border-radius:4px; }

  .add-bar{ display:flex; gap:10px; margin-top:12px; }
  .btn{ padding:9px 16px; border-radius:6px; border:none; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.15s; }
  .btn-navy{ background:var(--navy); color:#fff; }
  .btn-navy:hover{ background:var(--navy-dk); }
  .btn-red{ background:var(--red); color:#fff; }
  .btn-red:hover{ background:#a5301f; }
  .btn-outline{ background:#fff; color:var(--navy); border:1.5px solid var(--navy); }
  .btn-outline:hover{ background:var(--lightblue); }
  .btn-grey{ background:var(--grey); color:var(--text); border:1px solid var(--border); }

  .actions-row{ display:flex; justify-content:space-between; margin-top:6px; flex-wrap:wrap; gap:10px; }
  .status-badge{ font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px; background:#FDF0E6; color:var(--amber-dk); display:inline-flex; align-items:center; gap:5px; }

  /* ===== Preview overlay ===== */
  .overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:flex-start; justify-content:center; overflow:auto; padding:30px 10px; }
  .overlay.active{ display:flex; }
  .preview-sheet{ background:#fff; width:820px; max-width:100%; padding:40px 44px; border-radius:6px; }
  .preview-toolbar{ position:sticky; top:0; background:#fff; padding:10px 0; display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px; }

  /* ===== Printed PO document (mirrors the real GAL PO template) ===== */
  .po-doc{ font-family:'Segoe UI', Arial, sans-serif; color:#000; }
  .po-doc img.po-logo{ width:100%; max-width:none; height:auto; display:block; margin-bottom:14px; }
  .po-doc h1.po-title{ font-size:26px; font-weight:800; letter-spacing:0.02em; margin:6px 0 16px; }
  .po-meta-row{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:14px; flex-wrap:wrap; gap:6px; }
  .po-meta-row b{ font-weight:700; }

  .po-cols{ display:grid; grid-template-columns:1fr 1fr; gap:0; margin-bottom:0; border:1px solid #000; border-bottom:none; }
  .po-col{ border-right:1px solid #000; }
  .po-col:last-child{ border-right:none; }
  .po-col-label{ background:var(--labelred); color:#fff; font-weight:700; font-size:12.5px; padding:4px 8px; }
  .po-col-body{ padding:8px 10px; font-size:12.5px; line-height:1.5; min-height:70px; white-space:pre-line; }
  .po-col-body b{ display:block; margin-bottom:2px; }

  table.po-item-table{ width:100%; border-collapse:collapse; font-size:12.5px; border:1px solid #000; }
  table.po-item-table th{ border:1px solid #000; padding:5px 8px; font-size:12px; text-align:left; background:#fff; color:#000; font-weight:700; }
  table.po-item-table td{ border-left:1px solid #000; border-right:1px solid #000; padding:4px 8px; vertical-align:top; }
  table.po-item-table td.num{ text-align:center; width:36px; }
  table.po-item-table td.qty{ width:100px; }
  table.po-item-table td.remark{ width:140px; }
  table.po-item-table tr:last-child td{ border-bottom:1px solid #000; }
  .po-fill-row td{ height:26px; border-bottom:1px solid #000; }
  .po-remark-cell{ padding-top:10px; font-size:12.5px; white-space:pre-line; }
  .po-remark-cell b{ display:block; margin-bottom:3px; }

  .po-sign-row{ display:flex; justify-content:space-between; margin-top:34px; gap:30px; break-inside:avoid; page-break-inside:avoid; }
  .po-sign-col{ flex:1; }
  .po-sign-col .lbl{ font-weight:700; font-size:13px; margin-bottom:26px; }
  .po-sign-col .sig-line{ border-bottom:1px solid #000; width:220px; margin-bottom:4px; }
  .po-sign-col .meta{ font-size:12px; line-height:1.7; }

  @media print{
    @page{ size:A4; margin:12mm; }
    html, body{ background:#fff !important; }
    [class*="sign"], .grand-total-box, .pr-total{ break-inside:avoid; page-break-inside:avoid; }
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    /* hide everything except the open preview, and let the preview flow across as many pages as it needs */
    body > *:not(.overlay){ display:none !important; }
    .overlay:not(.active){ display:none !important; }
    .overlay.active{ display:block !important; position:static !important; inset:auto !important; background:none !important; padding:0 !important; overflow:visible !important; }
    .preview-sheet{ position:static !important; width:100% !important; max-width:none !important; padding:0 !important; border-radius:0 !important; box-shadow:none !important; }
    .preview-toolbar{ display:none !important; }
    table{ page-break-inside:auto; }
    thead{ display:table-header-group; }
    tr{ page-break-inside:avoid; }
  }
  @media (max-width:760px){
    .field-grid, .field-grid.two{ grid-template-columns:1fr; }
    .po-cols{ grid-template-columns:1fr; }
  }
</style>
</head>

<div class="container">

  <div class="card">
    <div class="card-header"><span class="step-badge">1</span> PO Details 采购单信息</div>
    <div class="card-body">
      <div class="field-grid">
        <div class="field">
          <label>PO Number 单号</label>
          <input type="text" id="po-number" readonly>
        </div>
        <div class="field">
          <label>Date 日期</label>
          <input type="date" id="po-date">
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <div class="checkbox-row" style="margin-top:9px">
            <input type="checkbox" id="po-amended">
            <label for="po-amended">Amended 修订单</label>
          </div>
        </div>
      </div>
      <div class="field-grid two" style="margin-top:14px">
        <div class="field">
          <label>Vendor Name 供应商名称</label>
          <input type="text" id="po-vendor-name" placeholder="e.g. MESMENANG SDN BHD">
        </div>
        <div class="field">
          <label>Vendor Address 供应商地址</label>
          <textarea id="po-vendor-address" placeholder="Lot 2768, Batu 6, Jalan Bukit Kemuning,&#10;Seksyen 32, 40460 Shah Alam&#10;Selangor D.E"></textarea>
        </div>
      </div>
      <div class="field-grid two" style="margin-top:14px">
        <div class="field">
          <label>Delivery Label 送货标签</label>
          <select id="po-ship-label">
            <option>SHIP TO</option>
            <option>DELIVER TO</option>
          </select>
        </div>
        <div class="field">
          <label>Delivery Address 送货地址</label>
          <textarea id="po-ship-address" placeholder="Site address, e.g.&#10;No.6, Jalan Impian 7A&#10;Ambang Botanic 2&#10;41200 Klang, Selangor"></textarea>
        </div>
      </div>
      <div class="field-grid two" style="margin-top:14px">
        <div class="field">
          <label>Order By (Supervisor) 申请人</label>
          <input type="text" id="po-order-name" placeholder="e.g. AH ZHEN">
        </div>
        <div class="field">
          <label>Contact 联系方式</label>
          <input type="text" id="po-order-contact" placeholder="e.g. 011-1270 3378">
        </div>
      </div>
      <div class="field-grid two" style="margin-top:14px">
        <div class="field">
          <label>Authorised By (Approver) 批准人</label>
          <input type="text" id="po-auth-name" placeholder="e.g. Hui Shan">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><span class="step-badge">2</span> Materials 材料清单</div>
    <div class="card-body">
      <div class="quick-add-title">Quick Add 快速添加常用材料</div>
      <div class="chip-row" id="chip-row"></div>

      <table class="item-table">
        <thead>
          <tr>
            <th style="width:34px">#</th>
            <th>Description 材料描述</th>
            <th class="qty-col">Qty 数量</th>
            <th class="remark-col">Remark 备注</th>
            <th style="width:36px"></th>
          </tr>
        </thead>
        <tbody id="item-body"></tbody>
      </table>

      <div class="add-bar">
        <button class="btn btn-outline" onclick="addBlankRow()">+ Add Item 添加材料</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><span class="step-badge">3</span> Delivery Remark 送货备注</div>
    <div class="card-body">
      <div class="field">
        <label>e.g. "SHIP OUT BY : 12 JULY 2026" or "DELIVER BY : ASAP"</label>
        <input type="text" id="po-remark" placeholder="SHIP OUT BY : ...">
      </div>
    </div>
  </div>

  <div class="actions-row">
    <span class="status-badge">⏳ Pending Approval 待审批</span>
    <div style="display:flex;gap:10px">
      <button class="btn btn-grey" onclick="clearAll()">Clear All 清空</button>
      <button class="btn btn-red" onclick="showPreview()">▶ Preview &amp; Print PO 预览打印</button>
    </div>
  </div>

</div>

<!-- Preview Overlay -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="preview-sheet">
    <div class="preview-toolbar">
      <button class="btn btn-grey" onclick="closePreview()">✕ Close 关闭</button>
      <button class="btn btn-navy" onclick="window.print()">🖨 Print 打印</button>
    </div>
    <div id="preview-content"></div>
  </div>
</div>

<script>
const materialCatalog = [
  "Cement 50KG/BAG", "River Sand", "Fine Sand", "3/4 Aggregate", "Common Clay Brick",
  "Y10.00MM x 12.00M HTD BAR ( Y10 )", "Y12.00MM x 12.00M HTD BAR ( Y12 )",
  "PVC 4\" Pipe", "PVC 6\" Pipe", "12mm Plywood Board", "BRC A10 ( BS )",
  "Tarpaulin Canvas", "Quick Mix Thin Plaster"
];

let items = [];
let rowSeq = 1;

function genPoNumber(){
  const d = new Date();
  const ym = d.getFullYear().toString() + '-' + String(d.getMonth()+1).padStart(2, '0');
  const key = 'gal_po_seq_' + ym;
  let seq = 1;
  try {
    const stored = localStorage.getItem(key);
    seq = stored ? (parseInt(stored, 10) + 1) : 1;
    localStorage.setItem(key, String(seq));
  } catch (e) {
    seq = 1; // localStorage unavailable — fall back to 001
  }
  return 'PO' + ym + '-' + String(seq).padStart(3, '0');
}

function init(){
  document.getElementById('po-number').value = genPoNumber();
  document.getElementById('po-date').value = new Date().toISOString().slice(0,10);

  const chipRow = document.getElementById('chip-row');
  chipRow.innerHTML = materialCatalog.map((m,i) => `<span class="chip" onclick="quickAdd(${i})">+ ${m}</span>`).join('');

  let draft = null;
  try { draft = JSON.parse(localStorage.getItem('gal_po_draft') || 'null'); } catch(e){ draft = null; }
  if (draft && draft.items && draft.items.length > 0){
    draft.items.forEach(it => {
      items.push({ id: rowSeq++, desc: it.desc || '', qty: it.qty || '', remark: it.remark || '' });
    });
    if (draft.sourceRef){
      const remarkField = document.getElementById('po-remark');
      if (remarkField) remarkField.value = 'Materials for upcoming tasks from Project Schedule ' + draft.sourceRef + ' 來自進度表的即將需要材料';
    }
    try { localStorage.removeItem('gal_po_draft'); } catch(e){}
  } else {
    addBlankRow();
    addBlankRow();
  }
  renderRows();
}

function quickAdd(i){
  items.push({ id: rowSeq++, desc: materialCatalog[i], qty: '', remark: '' });
  renderRows();
}

function addBlankRow(){
  items.push({ id: rowSeq++, desc: '', qty: '', remark: '' });
  renderRows();
}

function deleteRow(id){
  items = items.filter(r => r.id !== id);
  renderRows();
}

function updateField(id, field, val){
  const row = items.find(r => r.id === id);
  if (!row) return;
  row[field] = val;
}

function renderRows(){
  const body = document.getElementById('item-body');
  if (items.length === 0){
    body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:18px">No items yet 暂无材料</td></tr>';
    return;
  }
  body.innerHTML = items.map((r, idx) => `
    <tr>
      <td>${idx+1}</td>
      <td><textarea rows="1" oninput="updateField(${r.id},'desc',this.value)" placeholder="Material description">${r.desc}</textarea></td>
      <td><input type="text" value="${r.qty.replace(/"/g,'&quot;')}" oninput="updateField(${r.id},'qty',this.value)" placeholder="e.g. 50 PCS"></td>
      <td><input type="text" value="${r.remark.replace(/"/g,'&quot;')}" oninput="updateField(${r.id},'remark',this.value)" placeholder="optional"></td>
      <td><button class="del-btn" onclick="deleteRow(${r.id})">🗑</button></td>
    </tr>
  `).join('');
}

function fmtDate(s){
  if(!s) return '—';
  const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const d = new Date(s + 'T00:00:00');
  return String(d.getDate()).padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}
function fmtDateShort(s){
  if(!s) return '—';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = new Date(s + 'T00:00:00');
  return d.getDate() + '-' + months[d.getMonth()] + '-' + String(d.getFullYear()).slice(2);
}

function clearAll(){
  if (!confirm('Clear all items and reset the form? 确定要清空所有数据吗？')) return;
  items = [];
  rowSeq = 1;
  document.getElementById('po-vendor-name').value = '';
  document.getElementById('po-vendor-address').value = '';
  document.getElementById('po-ship-address').value = '';
  document.getElementById('po-order-name').value = '';
  document.getElementById('po-order-contact').value = '';
  document.getElementById('po-auth-name').value = '';
  document.getElementById('po-remark').value = '';
  document.getElementById('po-amended').checked = false;
  document.getElementById('po-number').value = genPoNumber();
  addBlankRow();
  addBlankRow();
}

function esc(s){ return (s||'').replace(/</g,'&lt;').replace(/\n/g,'<br>'); }

function showPreview(){
  const validItems = items.filter(r => r.desc.trim() !== '');
  if (validItems.length === 0){
    alert('Please add at least one item before preview.\n请至少添加一项材料后再预览。');
    return;
  }
  const poNumber = document.getElementById('po-number').value + (document.getElementById('po-amended').checked ? ' ( Amended )' : '');
  const date = fmtDate(document.getElementById('po-date').value);
  const dateShort = fmtDateShort(document.getElementById('po-date').value);
  const vendorName = document.getElementById('po-vendor-name').value || '—';
  const vendorAddress = document.getElementById('po-vendor-address').value || '—';
  const shipLabel = document.getElementById('po-ship-label').value;
  const shipAddress = document.getElementById('po-ship-address').value || '—';
  const orderName = document.getElementById('po-order-name').value || '—';
  const orderContact = document.getElementById('po-order-contact').value || '—';
  const authName = document.getElementById('po-auth-name').value || '';
  const remark = document.getElementById('po-remark').value;

  const rows = validItems.map((r, idx) => `
    <tr>
      <td class="num">${idx+1}</td>
      <td>${esc(r.desc) || '—'}</td>
      <td class="qty">${esc(r.qty)}</td>
      <td class="remark">${esc(r.remark)}</td>
    </tr>
  `).join('');

  const remarkRow = remark ? `
    <tr><td class="num"></td><td colspan="3" class="po-remark-cell"><b>Remark :</b>${esc(remark)}</td></tr>
  ` : '';
